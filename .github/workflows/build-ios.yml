name: Build iOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: iOS Build Check
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Install example pods
        working-directory: example/ios
        run: pod install --repo-update

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build iOS example (Debug, no signing)
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace BlurVibeExample.xcworkspace \
            -scheme BlurVibeExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty --color