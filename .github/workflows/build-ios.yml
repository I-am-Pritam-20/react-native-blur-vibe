name: Build iOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: iOS Build Check
    runs-on: macos-14  # Apple Silicon runner — Xcode 15+

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn tsc --noEmit

      - name: Setup Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Install example pods
        working-directory: example/ios
        run: pod install --repo-update

      - name: Build iOS example (Debug, no signing)
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace BlurVibeExample.xcworkspace \
            -scheme BlurVibeExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build \
            | xcpretty --color

      - name: Run iOS unit tests
        working-directory: example/ios
        run: |
          xcodebuild \
            -workspace BlurVibeExample.xcworkspace \
            -scheme BlurVibeExampleTests \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -derivedDataPath /tmp/DerivedData \
            test \
            | xcpretty --color
        continue-on-error: true  # Tests are best-effort until test suite is added